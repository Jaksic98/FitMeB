services:
  app:
    build: .
    container_name: fitme-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE}
      - JWT_COOKIE_SAME_SITE=${JWT_COOKIE_SAME_SITE}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
    depends_on:
      - postgres
    networks:
      - fitme-net

  postgres:
    image: postgres:16-alpine
    container_name: fitme-postgres
    restart: unless-stopped
    # No host port published - only the app container needs to reach this,
    # keep Postgres off the public internet.
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - fitme-db-data:/var/lib/postgresql/data
    networks:
      - fitme-net

volumes:
  fitme-db-data:

networks:
  fitme-net:
